<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Quiet Notes</title>
    <meta name="description" content="A quiet personal writing space for notes, tasks, journal entries, and checklists. Pages stay on this device." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Quiet Notes" />
    <meta property="og:description" content="A quiet personal writing space for notes, tasks, journal entries, and checklists. Pages stay on this device." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quiet Notes" />
    <meta name="twitter:description" content="A quiet personal writing space for notes, tasks, journal entries, and checklists. Pages stay on this device." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;background:#000;color:#ded8cd;font:16px system-ui,sans-serif">
        Opening Quiet Notes…
      </div>
    </div>
    <script>
      (() => {
        const root = document.getElementById('root');
        if (!root) return;

        const safeMessage = value => {
          const message = value instanceof Error
            ? `${value.name}: ${value.message}`
            : String(value ?? 'Unknown startup error');
          return message
            .replace(/(api[_ -]?key|password|passwd|token|secret|authorization|client[_ -]?secret)\s*[:=]\s*\S+/gi, '$1=[redacted]')
            .replace(/AIza[0-9A-Za-z_-]{20,}/g, '[redacted Firebase key]')
            .replace(/\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]*/g, '[redacted token]')
            .replace(/\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16})\b/g, '[redacted token]')
            .slice(0, 300);
        };

        const reportStartupError = (kind, value) => {
          if (document.documentElement.dataset.quietNotesStarted === 'true') return;
          const message = safeMessage(value);
          const panel = document.createElement('div');
          panel.setAttribute('role', 'alert');
          panel.style.cssText = 'min-height:100vh;box-sizing:border-box;display:grid;align-content:center;gap:12px;padding:32px;background:#000;color:#ded8cd;font:16px system-ui,sans-serif';
          const title = document.createElement('strong');
          title.textContent = "Quiet Notes couldn't start.";
          const detail = document.createElement('span');
          detail.textContent = `Startup ${kind}: ${message}`;
          const help = document.createElement('span');
          help.textContent = 'Close and reopen the app. If this continues, share the startup error with support.';
          panel.append(title, detail, help);
          root.replaceChildren(panel);
          console.error('Quiet Notes startup failure:', kind, message);
        };

        window.addEventListener('error', event => {
          const source = event.error || event.message ||
            (event.target instanceof Element ? `${event.target.tagName} failed to load` : 'Unknown startup error');
          reportStartupError('error', source);
        }, true);
        window.addEventListener('unhandledrejection', event => {
          reportStartupError('rejection', event.reason);
        });
        window.addEventListener('quiet-notes-started', () => {
          document.documentElement.dataset.quietNotesStarted = 'true';
        }, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
