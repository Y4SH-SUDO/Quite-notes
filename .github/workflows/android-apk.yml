name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "artifacts/quiet-notes/**"
      - ".github/workflows/android-apk.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm --dir artifacts/quiet-notes typecheck
      - name: Test backup, reminder, and sync logic
        run: pnpm --dir artifacts/quiet-notes test:backup
      - name: Verify required Firebase configuration
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          test -n "$VITE_FIREBASE_API_KEY" || { echo "::error::Required GitHub Actions repository variable VITE_FIREBASE_API_KEY is missing."; exit 1; }
          test -n "$VITE_FIREBASE_AUTH_DOMAIN" || { echo "::error::Required GitHub Actions repository variable VITE_FIREBASE_AUTH_DOMAIN is missing."; exit 1; }
          test -n "$VITE_FIREBASE_PROJECT_ID" || { echo "::error::Required GitHub Actions repository variable VITE_FIREBASE_PROJECT_ID is missing."; exit 1; }
          test -n "$VITE_FIREBASE_APP_ID" || { echo "::error::Required GitHub Actions repository variable VITE_FIREBASE_APP_ID is missing."; exit 1; }
      - name: Build web assets for Android
        run: pnpm --dir artifacts/quiet-notes build
        env:
          PORT: 5000
          BASE_PATH: ./
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Sync Android project
        run: pnpm --dir artifacts/quiet-notes android:sync
      - name: Check release signing configuration
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure release signing
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quiet-notes-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/quiet-notes-release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        id: apk
        working-directory: artifacts/quiet-notes/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_PATH" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            ./gradlew --no-daemon assembleRelease
            echo "path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            ./gradlew --no-daemon assembleDebug
            echo "path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-notes-${{ steps.apk.outputs.variant }}-apk
          path: artifacts/quiet-notes/android/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
